<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <script>
      try {
        if (sessionStorage.getItem("liquid-glass-theme") === "night") {
          document.documentElement.dataset.theme = "night";
          document.querySelector('meta[name="theme-color"]').content = "#000000";
        }
      } catch {}
    </script>
    <title>Multiverse Glass Match</title>
    <meta name="description" content="A non-commercial WebGL2 match-3 game with otherworldly planets, familiar worlds, liquid-glass fusion and color-sampled black holes.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <canvas id="board" aria-label="Multiverse Glass Match board"></canvas>
    <div id="appearance-tools" role="group" aria-label="Appearance">
      <div id="planet-control">
        <label for="planet-switch" title="Otherworld Mode when off · Familiar planets when on">
          <svg viewBox="0 0 256 256" aria-hidden="true"><circle cx="128" cy="128" r="96"/><path d="m83 43 9 35-24 24 12 31 32 8 8 35 29 25 19-29-1-29 31-25 24 3M149 35l-12 31 24 17 26-9M35 135l30 17 6 40"/></svg>
          <span class="visually-hidden">Planet Mode</span>
        </label>
        <button type="button" id="planet-switch" role="switch" aria-label="Planet Mode" aria-checked="false" aria-busy="false" title="Otherworld Mode · Switch to Planet Mode">
          <span class="planet-switch-visual" aria-hidden="true">
            <span class="planet-switch-track"></span>
            <span class="planet-switch-fill"></span>
            <span class="planet-switch-thumb">
              <span class="planet-switch-lens">
                <span class="planet-switch-scene">
                  <span class="planet-switch-copy">
                    <span class="planet-switch-track"></span>
                    <span class="planet-switch-fill"></span>
                  </span>
                </span>
              </span>
              <span class="planet-switch-face"></span>
            </span>
          </span>
        </button>
      </div>
    <button type="button" id="theme-switch" role="switch" aria-label="Dark mode" aria-checked="false">
      <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4m0-13.4-1.4 1.4M6.7 17.3l-1.4 1.4" />
      </svg>
      <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 15.2A8.8 8.8 0 0 1 8.8 3.5a8.8 8.8 0 1 0 11.7 11.7Z" />
      </svg>
    </button>
    </div>
    <p id="mode-status" role="status" aria-live="polite" hidden></p>
    <div id="game-tools">
      <button type="button" id="shuffle-orbs" aria-label="Randomize worlds and restart" title="Randomize worlds and restart">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224 104V48l-24 24a96 96 0 1 0 22 104M224 104h-56" /></svg>
      </button>
      <button type="button" id="shader-book" aria-label="Open shader gallery" aria-haspopup="dialog" aria-controls="shader-dialog" title="Shader gallery">
      <svg viewBox="0 0 256 256" aria-hidden="true">
        <path d="M128 64C104 48 64 40 24 48v152c40-8 80 0 104 16 24-16 64-24 104-16V48c-40-8-80 0-104 16Zm0 0v152" />
      </svg>
      </button>
    </div>
    <dialog id="shader-dialog" aria-labelledby="shader-title">
      <header class="shader-header">
        <h1 id="shader-title">Otherworld Mode gallery</h1>
        <div class="shader-actions">
          <button type="button" id="shader-edit" aria-label="Edit orb selection" aria-pressed="false" title="Edit orb selection">
            <svg viewBox="0 0 256 256" aria-hidden="true"><path d="m128 48 36-20 32 18v40l32 18v48l-32 18v40l-32 18-36-20-36 20-32-18v-40l-32-18v-48l32-18V46l32-18Z" /><circle cx="128" cy="128" r="40" /></svg>
          </button>
          <button type="button" id="shader-close" aria-label="Close shader gallery" autofocus>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
      </header>
      <div class="shader-body" tabindex="0" role="region" aria-label="Shader orb list">
        <div id="shader-list"></div>
        <p class="shader-credit" id="shader-credit">Shaders by <a href="https://x.com/XorDev" target="_blank" rel="noopener noreferrer">XorDev</a> / <a href="https://github.com/zzzzshawn/orbkit" target="_blank" rel="noopener noreferrer">zzzzshawn</a> · Adapted from Orbkit · Non-commercial use only</p>
      </div>
      <footer id="shader-editor" hidden>
        <span id="shader-selection-count" role="status" aria-live="polite"></span>
        <div class="shader-actions">
          <button type="button" id="shader-cancel">Cancel</button>
          <button type="button" id="shader-apply">Apply</button>
        </div>
      </footer>
    </dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
